<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الويب</title>
    <style>
        /* إعدادات عامة */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* شاشة التحميل (Splash Screen) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        #splash-screen img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        /* حاوية الموقع (Iframe) */
        #content-frame {
            display: none;
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>

    <!-- الشاشة البيضاء مع الصورة -->
    <div id="splash-screen">
        <img src="https://i.ibb.co/KckjHnj8/images-5.jpg" alt="Logo">
    </div>

    <!-- نافذة عرض الموقع -->
    <iframe id="content-frame" src="https://hushed-amaranth-af5wtpdsrz.edgeone.app/"></iframe>

    <script>
        // الانتظار لمدة 5000 ميلي ثانية (5 ثوانٍ)
        setTimeout(function() {
            var splash = document.getElementById('splash-screen');
            var frame = document.getElementById('content-frame');

            // إخفاء شاشة التحميل
            splash.style.opacity = '0';
            
            // إظهار الموقع بعد انتهاء تأثير التلاشي
            setTimeout(function() {
                splash.style.display = 'none';
                frame.style.display = 'block';
            }, 500);
            
        }, 5000);
    </script>
</body>
</html>
