<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر الأكواد المطور | Phantom Editor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --accent-color: #000000;
            --text-color: #f1f5f9;
            --border-color: #222222;
            --keyword-color: #ff79c6;
            --tag-color: #8be9fd;
            --attr-color: #50fa7b;
            --comment-color: #6272a4;
            --input-bg: transparent;
            --btn-invert: 1;
        }

        .light-mode {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --accent-color: #e0e0e0;
            --text-color: #1a1a1a;
            --border-color: #cccccc;
            --keyword-color: #d73a49;
            --tag-color: #005cc5;
            --attr-color: #6f42c1;
            --comment-color: #6a737d;
            --btn-invert: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            font-weight: 300;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .all-controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .button-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .editor-wrapper {
            position: relative;
            width: 100%;
            height: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            overflow: hidden;
            border-radius: 15px;
        }

        #code-input,
        #highlight-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 12px;
            border: none;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.5;
            tab-size: 4;
            white-space: pre-wrap;
            word-wrap: break-word;
            box-sizing: border-box;
            direction: ltr;
            text-align: left;
            border-radius: 15px;
        }

        #code-input::placeholder {
            font-family: 'Cairo', sans-serif;
            font-weight: 300;
            font-size: 16px;
            color: #888;
            text-align: right;
        }

        #code-input {
            background: transparent;
            color: transparent;
            caret-color: var(--text-color);
            resize: none;
            z-index: 2;
            outline: none;
        }

        #highlight-layer {
            z-index: 1;
            color: var(--text-color);
            overflow-y: auto;
            pointer-events: none;
        }

        .hl-tag { color: var(--tag-color); font-weight: bold; }
        .hl-attr { color: var(--attr-color); }
        .hl-keyword { color: var(--keyword-color); }
        .hl-comment { color: var(--comment-color); font-style: italic; }
        .hl-string { color: #f1fa8c; }
        .light-mode .hl-string { color: #032f62; }

        #preview-window {
            display: none;
            width: 100%;
            height: 600px;
            background-color: #ffffff;
            border-radius: 15px;
            border: 2px solid var(--border-color);
            box-sizing: border-box;
        }

        #back-btn {
            display: none;
            background-color: transparent;
            border: none;
            cursor: pointer;
        }

        #back-btn img {
            width: 30px;
            height: 30px;
            filter: invert(var(--btn-invert));
        }

        button {
            background-color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            font-weight: 300;
        }

        button:hover { opacity: 0.8; }
        button img { width: 20px; height: 20px; filter: invert(var(--btn-invert)); }

        .notification-container { position: relative; display: flex; align-items: center; }
        #red-dot {
            display: none; position: absolute; top: -2px; right: -2px;
            width: 8px; height: 8px; background-color: red; border-radius: 50%;
        }

        #history-modal, #notifications-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 1001; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }

        #filename-modal, #save-project-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 10px;
            z-index: 1000; width: 90%; max-width: 400px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .notification-item {
            background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 15px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px;
        }

        .timer-text {
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-weight: 300;
            font-size: 13px;
            margin-top: 5px;
            display: block;
            direction: ltr;
            text-align: right;
        }

        .warning-text {
            color: #ff4d4d;
            font-size: 11px;
            margin-top: 2px;
            display: block;
        }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 999;
        }

        .input-field {
            width: 100%; padding: 10px; background: var(--bg-color); border: 1px solid var(--border-color);
            color: var(--text-color); border-radius: 5px; margin-bottom: 15px; font-family: 'Cairo', sans-serif; box-sizing: border-box;
        }

        .history-header { display: flex; justify-content: flex-end; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        .close-history-btn { background: transparent !important; border: none !important; }
        .close-history-btn img { width: 35px; height: 35px; filter: invert(var(--btn-invert)); }
        
        .view-link-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 5px;
            border-radius: 4px;
            margin-top: 8px;
        }
        
        .view-link-btn img {
            width: 18px;
            height: 18px;
            filter: invert(var(--btn-invert));
        }

        .view-link-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="modal-overlay" id="overlay" onclick="closeModals()"></div>

    <div id="notifications-modal">
        <div class="history-header">
            <button onclick="closeModals()" class="close-history-btn">
                <img src="https://images.icon-icons.com/3162/PNG/96/left_return_arrow_icon_193335.png">
            </button>
        </div>
        <div id="notifications-list"></div>
    </div>

    <!-- Modals -->
    <div id="filename-modal">
        <h3 style="margin-top: 0; font-size: 16px;">أدخل اسم الملف لتحميله</h3>
        <input type="text" id="zip-filename" class="input-field" placeholder="مثال: my_project">
        <div style="display:flex; gap:10px;">
            <button onclick="confirmDownload()" style="flex:1;"><img src="https://images.icon-icons.com/1875/PNG/96/download_120262.png"></button>
            <button onclick="closeModals()" style="flex:1;"><img src="https://images.icon-icons.com/1769/PNG/96/4115230-cancel-close-cross-delete_114048.png"></button>
        </div>
    </div>

    <div id="save-project-modal">
        <h3 style="margin-top: 0; font-size: 16px;">أدخل اسم المشروع لحفظه</h3>
        <input type="text" id="project-name-input" class="input-field" placeholder="اسم المشروع...">
        <div style="display:flex; gap:10px;">
            <button onclick="confirmSave()" style="flex:1;">حفظ</button>
            <button onclick="closeModals()" style="flex:1;">إلغاء</button>
        </div>
    </div>

    <div id="history-modal">
        <div class="history-header">
            <button onclick="closeModals()" class="close-history-btn">
                <img src="https://images.icon-icons.com/3162/PNG/96/left_return_arrow_icon_193335.png">
            </button>
        </div>
        <div id="history-list"></div>
    </div>

    <div class="container">
        <div class="top-header">
            <div id="editor-label" style="font-size: 14px; color: #666;"></div>
            <button id="back-btn" onclick="toggleEditor()">
                <img src="https://images.icon-icons.com/3162/PNG/96/left_return_arrow_icon_193335.png">
            </button>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button onclick="toggleTheme()" style="border: none; background: transparent;">
                    <img src="https://images.icon-icons.com/1579/PNG/96/3586363-creative-idea-light-lightbulb_107937.png"
                        style="width: 25px; height: 25px; filter: invert(var(--btn-invert));">
                </button>
                
                <div class="notification-container">
                    <button onclick="openNotifications()" style="border: none; background: transparent;">
                        <img src="https://images.icon-icons.com/3449/PNG/96/attention_notice_bell_alarm_reminder_alert_notification_icon_219315.png"
                            style="width: 20px; height: 20px; filter: invert(var(--btn-invert));">
                    </button>
                    <div id="red-dot"></div>
                </div>
                <button onclick="openHistory()" style="border: none; background: transparent;">
                    <img src="https://images.icon-icons.com/508/PNG/96/settings_icon-icons.com_49858.png"
                        style="width: 20px; height: 20px; filter: invert(var(--btn-invert));">
                </button>
            </div>
        </div>

        <div class="all-controls-wrapper" id="main-controls-wrapper">
            <div class="button-group">
                <button onclick="copyCode()"><img src="https://images.icon-icons.com/3476/PNG/96/internet_browser_essential_basic_website_web_paste_copy_ui_icon_219913.png"></button>
                <button onclick="pasteCode()"><img src="https://images.icon-icons.com/2783/PNG/96/content_paste_copy_clipboard_icon_177307.png"></button>
                <button onclick="clearCode()"><img src="https://images.icon-icons.com/868/PNG/96/trash_bin_icon-icons.com_67981.png"></button>
                <button onclick="searchCode()"><img src="https://images.icon-icons.com/1182/PNG/96/1490129321-rounded10_82180.png"></button>
                <button onclick="checkErrors()"><img src="https://images.icon-icons.com/3298/PNG/96/yes_accept_check_ok_correct_icon_208816.png"></button>
                <button onclick="showFilenameInput()"><img src="https://images.icon-icons.com/4043/PNG/96/file_direction_down_save_download_icon_256878.png"></button>
            </div>
            <div class="button-group">
                <button onclick="shareCode()"><img src="https://images.icon-icons.com/1238/PNG/96/shareconnectionsing_83771.png"></button>
                <button onclick="openLivePreview()"><img src="https://images.icon-icons.com/1913/PNG/96/iconfinder-bl-1645-search-seo-magnifier-earth-globe-internet-4575058_121505.png"></button>
                <button onclick="saveCode()"><img src="https://images.icon-icons.com/4026/PNG/96/save_icon_255899.png"></button>
                <button onclick="undoCode()"><img src="https://images.icon-icons.com/3831/PNG/96/return_down_back_icon_233994.png"></button>
                <button onclick="redoCode()"><img src="https://images.icon-icons.com/3833/PNG/96/return_down_forward_icon_234821.png"></button>
                <button onclick="runCode()" style="background: var(--border-color);"><img src="https://images.icon-icons.com/3259/PNG/96/play_playback_icon_206354.png"></button>
            </div>
        </div>

        <div class="editor-wrapper" id="editor-container">
            <div id="highlight-layer"></div>
            <textarea id="code-input" placeholder="اكتب الكود هنا..." oninput="updateHighlight()"
                onscroll="syncScroll()"></textarea>
        </div>

        <iframe id="preview-window"></iframe>
    </div>

    <script>
        const input = document.getElementById('code-input');
        const output = document.getElementById('highlight-layer');

        window.onload = function() {
            sessionStorage.removeItem('web_notifications');
            checkNotifications();
            if(localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
            }
            setInterval(updateAllTimers, 1000);
        };

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const currentTheme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
            localStorage.setItem('theme', currentTheme);
        }

        function openLivePreview() {
            if (!input.value || !input.value.trim()) {
                alert("يرجى كتابة كود أولاً!");
                return;
            }

            const blob = new Blob([input.value], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            
            const now = new Date();
            const expiryTime = now.getTime() + (1 * 60 * 1000); 

            const notificationMsg = `مرحبا بكم في موقع cod.html.2027 لقد وصلك هذا الرابط لمعاينة الكود الخاص بك (يعمل لمرة واحدة):`;

            let notes = JSON.parse(sessionStorage.getItem('web_notifications') || "[]");
            notes.unshift({
                id: Date.now(),
                msg: notificationMsg,
                link: url,
                expiry: expiryTime,
                used: false,
                date: now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0')
            });
            sessionStorage.setItem('web_notifications', JSON.stringify(notes));

            checkNotifications();
            alert("تم إنشاء رابط المعاينة في الإشعارات.");
        }

        function updateAllTimers() {
            const notes = JSON.parse(sessionStorage.getItem('web_notifications') || "[]");
            const now = new Date().getTime();

            notes.forEach((n) => {
                const timeLeft = n.expiry - now;
                const timerElement = document.getElementById(`timer-${n.id}`);
                
                if (timeLeft <= 0 || n.used) {
                    if (timerElement) {
                        timerElement.innerHTML = n.used ? "تم استخدام الرابط" : "انتهت صلاحية الرابط";
                        const btns = timerElement.parentElement.querySelectorAll('.view-link-btn');
                        btns.forEach(btn => btn.disabled = true);
                    }
                } else {
                    if (timerElement) {
                        const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                        timerElement.innerHTML = `ينتهي خلال: ${seconds} ثانية`;
                    }
                }
            });
        }

        function openNotifications() {
            const list = document.getElementById('notifications-list');
            const notes = JSON.parse(sessionStorage.getItem('web_notifications') || "[]");
            list.innerHTML = notes.length ? '' : '<p style="text-align:center; color:#666">لا توجد إشعارات حالياً (تُمسح عند التحديث)</p>';
            
            notes.forEach((n, index) => {
                const div = document.createElement('div');
                div.className = 'notification-item';
                div.innerHTML = `
                <div style="flex:1">
                    <div style="font-weight:300; font-family:'Cairo', sans-serif;">${n.msg}</div>
                    <span class="warning-text">⚠️ سيتم تعطيل الرابط فور فتحه أو تحديث الصفحة!</span>
                    <div style="color:#50fa7b; font-size:12px; word-break:break-all; margin-top:5px;">https://cod.html.2027</div>
                    <span class="timer-text" id="timer-${n.id}">...</span>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="openExternalLink('${n.link}', ${n.expiry}, ${index})" class="view-link-btn" title="فتح الرابط" ${n.used ? 'disabled' : ''}>
                            <img src="https://images.icon-icons.com/510/PNG/96/eye_icon-icons.com_50398.png">
                        </button>
                        <button onclick="copyToClipboard('${n.link}')" class="view-link-btn" title="نسخ الرابط الحقيقي" ${n.used ? 'disabled' : ''}>
                            <img src="https://images.icon-icons.com/3476/PNG/96/internet_browser_essential_basic_website_web_paste_copy_ui_icon_219913.png">
                        </button>
                    </div>
                </div>
                <button onclick="deleteNote(${index})" style="background:transparent; color:red; border:none; font-size:20px">×</button>
            `;
                list.appendChild(div);
            });
            document.getElementById('notifications-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
            updateAllTimers();
        }

        function copyToClipboard(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert('تم نسخ الرابط الحقيقي (Blob) إلى الحافظة!');
        }

        function openExternalLink(url, expiry, index) {
            if (new Date().getTime() > expiry) {
                alert("انتهت صلاحية هذا الرابط!");
                return;
            }
            
            let notes = JSON.parse(sessionStorage.getItem('web_notifications') || "[]");
            notes[index].used = true;
            sessionStorage.setItem('web_notifications', JSON.stringify(notes));
            
            window.open(url, '_blank');
            openNotifications();
        }

        function deleteNote(index) {
            let notes = JSON.parse(sessionStorage.getItem('web_notifications') || "[]");
            notes.splice(index, 1);
            sessionStorage.setItem('web_notifications', JSON.stringify(notes));
            openNotifications();
            checkNotifications();
        }

        function checkNotifications() {
            const notes = JSON.parse(sessionStorage.getItem('web_notifications') || "[]");
            document.getElementById('red-dot').style.display = notes.length > 0 ? 'block' : 'none';
        }

        function closeModals() {
            document.querySelectorAll('#history-modal, #notifications-modal, #filename-modal, #save-project-modal, #overlay').forEach(el => el.style.display = 'none');
        }

        function updateHighlight() {
            let code = input.value;
            code = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            code = code.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="hl-comment">$1</span>');
            code = code.replace(/(&lt;[a-zA-Z1-6]+)(?=\s|&gt;)/g, '<span class="hl-tag">$1</span>');
            code = code.replace(/(&lt;\/[a-zA-Z1-6]+&gt;)/g, '<span class="hl-tag">$1</span>');
            code = code.replace(/\b(class|id|style|src|href|onclick|type|placeholder|name|value|rel|lang|dir|charset|width|height)\b/g, '<span class="hl-attr">$1</span>');
            code = code.replace(/(["'])(?:(?=(\\?))\2.)*?\1/g, '<span class="hl-string">$&</span>');
            
            output.innerHTML = code + "\n";
        }

        function syncScroll() {
            output.scrollTop = input.scrollTop;
            output.scrollLeft = input.scrollLeft;
        }

        function copyCode() {
            input.select();
            document.execCommand('copy');
            alert('تم نسخ الكود!');
        }

        function clearCode() {
            if(confirm('هل تريد مسح الكود بالكامل؟')) {
                input.value = '';
                updateHighlight();
            }
        }

        function runCode() {
            const preview = document.getElementById('preview-window');
            const editor = document.getElementById('editor-container');
            const backBtn = document.getElementById('back-btn');
            const controls = document.getElementById('main-controls-wrapper');

            preview.srcdoc = input.value;
            preview.style.display = 'block';
            editor.style.display = 'none';
            controls.style.display = 'none';
            backBtn.style.display = 'flex';
        }

        function toggleEditor() {
            document.getElementById('preview-window').style.display = 'none';
            document.getElementById('editor-container').style.display = 'block';
            document.getElementById('main-controls-wrapper').style.display = 'flex';
            document.getElementById('back-btn').style.display = 'none';
        }
    </script>
</body>

</html>
