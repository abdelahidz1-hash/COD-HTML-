<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستعرض الأكواد</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبة JSZip لإنشاء ملفات الزيب -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-color: #000000; 
            --card-bg: #111111;
            --accent-color: #000000; 
            --text-color: #f1f5f9;
            --border-color: #222222;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            font-weight: 300;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: -5px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: var(--card-bg);
            color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Cairo', monospace;
            font-size: 14px;
            font-weight: 300;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        textarea:focus {
            border-color: #333;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .controls {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
        }

        .bottom-controls {
            display: flex;
            gap: 8px;
            justify-content: center; 
            margin-top: 10px;
        }

        button {
            background-color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button img {
            width: 20px;
            height: 20px;
            filter: invert(1); 
        }

        button:hover {
            background-color: #111;
            transform: scale(0.95);
        }

        #preview-window {
            width: 100%;
            min-height: 450px;
            background-color: #000000; 
            border-radius: 10px;
            border: 2px solid var(--border-color);
            box-sizing: border-box;
        }

        .label {
            font-size: 14px;
            color: #666;
        }

        /* تنسيق النوافذ المنبثقة */
        #history-modal, #filename-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .history-item {
            background: #1a1a1a;
            border: 1px solid #222;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
            margin-bottom: 15px;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="modal-overlay" id="overlay" onclick="closeModals()"></div>

    <!-- نافذة تسمية الملف -->
    <div id="filename-modal">
        <h3 style="margin-top: 0; font-size: 16px;">أدخل اسم الملف</h3>
        <input type="text" id="zip-filename" class="input-field" placeholder="مثال: my_project">
        <div style="display: flex; gap: 10px;">
            <button onclick="confirmDownload()" style="flex: 1; background: #1a1a1a;">تحميل</button>
            <button onclick="closeModals()" style="flex: 1; background: #000; color: #666;">إلغاء</button>
        </div>
    </div>

    <!-- نافذة السجلات -->
    <div id="history-modal">
        <h3 style="margin-top: 0;">سجلات الأكواد المحفوظة</h3>
        <div id="history-list"></div>
        <button onclick="closeModals()" style="width: 100%; margin-top: 10px; background: #222;">إغلاق</button>
    </div>

    <div class="container">
        <div class="top-header">
            <div class="label">محرر الأكواد:</div>
            <button onclick="openHistory()" title="سجلات الأكواد" style="border: none; background: transparent;">
                <img src="https://images.icon-icons.com/508/PNG/96/settings_icon-icons.com_49858.png" alt="سجلات" style="width: 25px; height: 25px;">
            </button>
        </div>

        <textarea id="code-input" placeholder="اكتب الكود هنا..."></textarea>
        
        <div class="controls">
            <button class="copy-btn" onclick="copyCode()" title="نسخ الكود">
                <img src="https://images.icon-icons.com/3476/PNG/96/internet_browser_essential_basic_website_web_paste_copy_ui_icon_219913.png" alt="نسخ">
            </button>
            <button class="paste-btn" onclick="pasteCode()" title="لصق الكود">
                <img src="https://images.icon-icons.com/2783/PNG/96/content_paste_copy_clipboard_icon_177307.png" alt="لصق">
            </button>
            <button class="run-btn" onclick="runPreview()" title="تشغيل الكود">
                <img id="play-icon" src="https://images.icon-icons.com/3259/PNG/96/play_playback_icon_206354.png" alt="تشغيل">
            </button>
            <button class="clear-btn" onclick="clearCode()" title="مسح الكود">
                <img src="https://images.icon-icons.com/868/PNG/96/trash_bin_icon-icons.com_67981.png" alt="مسح">
            </button>
        </div>

        <div class="label" style="margin-bottom: -10px;">المعاينة الحية:</div>
        <iframe id="preview-window"></iframe>

        <div class="bottom-controls">
            <button class="zip-btn" onclick="showFilenameInput()" title="تحميل ملف ZIP">
                <img src="https://images.icon-icons.com/4043/PNG/96/file_direction_down_save_download_icon_256878.png" alt="تحميل">
            </button>
            <button class="save-btn" onclick="saveCode()" title="حفظ الكود">
                <img src="https://images.icon-icons.com/4026/PNG/96/save_icon_255899.png" alt="حفظ">
            </button>
        </div>
    </div>

    <script>
        const playImg = "https://images.icon-icons.com/3259/PNG/96/play_playback_icon_206354.png";
        const pauseImg = "https://images.icon-icons.com/2838/PNG/96/media_playback_pause_icon_180873.png";

        function showFilenameInput() {
            const code = document.getElementById('code-input').value;
            if (!code.trim()) {
                alert("يرجى كتابة كود أولاً لتحميله!");
                return;
            }
            document.getElementById('filename-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('zip-filename').focus();
        }

        function confirmDownload() {
            const code = document.getElementById('code-input').value;
            let filename = document.getElementById('zip-filename').value.trim();
            if (!filename) filename = "project_code";
            
            const zip = new JSZip();
            zip.file("index.html", code);
            
            zip.generateAsync({type: "blob"}).then(function(content) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = filename + ".zip";
                link.click();
                closeModals();
            });
        }

        function saveCode() {
            const code = document.getElementById('code-input').value;
            if (!code.trim()) return;

            let history = JSON.parse(localStorage.getItem('codeHistory') || "[]");
            const newEntry = {
                id: Date.now(),
                date: new Date().toLocaleString('ar-EG'),
                content: code
            };
            
            history.unshift(newEntry); 
            localStorage.setItem('codeHistory', JSON.stringify(history));
            localStorage.setItem('savedCode', code); 
            alert('تم حفظ الكود في السجلات!');
        }

        function openHistory() {
            const modal = document.getElementById('history-modal');
            const overlay = document.getElementById('overlay');
            const list = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('codeHistory') || "[]");

            list.innerHTML = history.length === 0 ? '<p style="text-align:center; color:#666;">لا توجد سجلات بعد</p>' : '';

            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <span style="font-size:12px; color:#aaa;">${item.date}</span>
                    <div style="display:flex; gap:5px;">
                        <button onclick="restoreCode(${item.id})" style="padding:4px 8px; font-size:10px;">استعادة</button>
                        <button onclick="deleteHistory(${item.id})" style="padding:4px 8px; font-size:10px; border-color:red;">حذف</button>
                    </div>
                `;
                list.appendChild(div);
            });

            modal.style.display = 'block';
            overlay.style.display = 'block';
        }

        function restoreCode(id) {
            const history = JSON.parse(localStorage.getItem('codeHistory') || "[]");
            const item = history.find(i => i.id === id);
            if (item) {
                document.getElementById('code-input').value = item.content;
                closeModals();
                runPreview();
            }
        }

        function deleteHistory(id) {
            let history = JSON.parse(localStorage.getItem('codeHistory') || "[]");
            history = history.filter(i => i.id !== id);
            localStorage.setItem('codeHistory', JSON.stringify(history));
            openHistory(); 
        }

        function closeModals() {
            document.getElementById('history-modal').style.display = 'none';
            document.getElementById('filename-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function loadSavedCode() {
            const saved = localStorage.getItem('savedCode');
            if (saved) {
                document.getElementById('code-input').value = saved;
            }
        }

        function copyCode() {
            const codeInput = document.getElementById('code-input');
            codeInput.select();
            navigator.clipboard.writeText(codeInput.value);
        }

        async function pasteCode() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('code-input').value += text;
            } catch (err) { console.error(err); }
        }

        function runPreview() {
            const code = document.getElementById('code-input').value;
            const previewFrame = document.getElementById('preview-window');
            const icon = document.getElementById('play-icon');
            const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;

            icon.src = (icon.src === playImg) ? pauseImg : playImg;

            previewDoc.open();
            previewDoc.write(code);
            previewDoc.close();
        }

        function clearCode() {
            document.getElementById('code-input').value = '';
            document.getElementById('play-icon').src = playImg;
            resetPreviewBackground();
        }

        function resetPreviewBackground() {
            const previewFrame = document.getElementById('preview-window');
            const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            previewDoc.open();
            previewDoc.write('<body style="background-color: black;"></body>');
            previewDoc.close();
        }

        window.onload = () => {
            loadSavedCode();
            resetPreviewBackground();
        };
    </script>
</body>
</html>
